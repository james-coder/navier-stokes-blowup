[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-blowup"
version = "0.2.0"
description = "Differentiable JAX Navier–Stokes simulation and analytical validation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["navier-stokes", "fluid-dynamics", "jax", "differentiable-simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["jax>=0.11.1", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/james-coder/navier-stokes-blowup"
Documentation = "https://github.com/james-coder/navier-stokes-blowup/tree/main/docs"
Issues = "https://github.com/james-coder/navier-stokes-blowup/issues"
Changelog = "https://github.com/james-coder/navier-stokes-blowup/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.11.1"]
cuda13 = ["jax[cuda13]>=0.11.1"]
plot = ["matplotlib>=3.8"]
reference = ["mpmath>=1.3,<2"]
dev = ["pytest>=8", "mpmath>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ns_blowup = ["assets/*.html"]
